name: Discord Release Notification

'on':
  release:
    types:
      - published

jobs:
  notify-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send Release to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
          AUTHOR_NAME: ${{ github.event.release.author.login }}
          REPOSITORY: ${{ github.repository }}

        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          webhook = os.environ["DISCORD_WEBHOOK"]

          release_name = os.environ.get("RELEASE_NAME") or "New Release"
          release_tag = os.environ.get("RELEASE_TAG") or "Unknown"
          release_url = os.environ.get("RELEASE_URL") or ""
          release_body = os.environ.get("RELEASE_BODY") or "No changelog provided."
          author = os.environ.get("AUTHOR_NAME") or "Unknown"
          repository = os.environ.get("REPOSITORY") or "S82Studio/RedeemCode"

          if len(release_body) > 3500:
              release_body = release_body[:3500] + "\n..."

          payload = {
              "username": "S82Studio • RedeemCode",
              "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
              "embeds": [
                  {
                      "title": f"🚀 RedeemCode {release_tag}",
                      "description": "A new version of **RedeemCode** is now available!",
                      "url": release_url,
                      "color": 5814783,

                      "fields": [
                          {
                              "name": "✨ What's New",
                              "value": release_body,
                              "inline": False
                          },
                          {
                              "name": "📦 Version",
                              "value": f"`{release_tag}`",
                              "inline": True
                          },
                          {
                              "name": "👤 Released by",
                              "value": f"`{author}`",
                              "inline": True
                          },
                          {
                              "name": "📁 Repository",
                              "value": f"`{repository}`",
                              "inline": False
                          }
                      ],

                      "footer": {
                          "text": "S82Studio • RedeemCode"
                      },

                      "timestamp": datetime.now(timezone.utc).isoformat()
                  }
              ]
          }

          data = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              webhook,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "GitHub-Actions-RedeemCode"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              print("Discord response:", response.status)
